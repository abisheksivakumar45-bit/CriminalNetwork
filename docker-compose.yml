services:
  neo4j:
    image: neo4j:5.15-community
    container_name: crimnet-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimnet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - NEO4J_DATABASE=neo4j
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - SPACY_MODEL=en_core_web_sm
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - AUTH_ACCESS_TOKEN_EXPIRE_MINUTES=${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - AUTH_REFRESH_TOKEN_EXPIRE_DAYS=${AUTH_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_DEMO_ENABLED=${AUTH_DEMO_ENABLED:-true}
      - AUTH_DEMO_ADMIN_USERNAME=${AUTH_DEMO_ADMIN_USERNAME:-admin}
      - AUTH_DEMO_ADMIN_PASSWORD=${AUTH_DEMO_ADMIN_PASSWORD:-}
      - AUTH_DEMO_ADMIN_DISPLAY_NAME=${AUTH_DEMO_ADMIN_DISPLAY_NAME:-Administrator}
      - AUTH_DEMO_ADMIN_EMAIL=${AUTH_DEMO_ADMIN_EMAIL:-admin@crimenet.demo}
      - AUTH_DEMO_INVESTIGATOR_USERNAME=${AUTH_DEMO_INVESTIGATOR_USERNAME:-investigator}
      - AUTH_DEMO_INVESTIGATOR_PASSWORD=${AUTH_DEMO_INVESTIGATOR_PASSWORD:-}
      - AUTH_DEMO_INVESTIGATOR_DISPLAY_NAME=${AUTH_DEMO_INVESTIGATOR_DISPLAY_NAME:-Senior Investigator}
      - AUTH_DEMO_INVESTIGATOR_EMAIL=${AUTH_DEMO_INVESTIGATOR_EMAIL:-investigator@crimenet.demo}
      - AUTH_DEMO_ANALYST_USERNAME=${AUTH_DEMO_ANALYST_USERNAME:-analyst}
      - AUTH_DEMO_ANALYST_PASSWORD=${AUTH_DEMO_ANALYST_PASSWORD:-}
      - AUTH_DEMO_ANALYST_DISPLAY_NAME=${AUTH_DEMO_ANALYST_DISPLAY_NAME:-Intelligence Analyst}
      - AUTH_DEMO_ANALYST_EMAIL=${AUTH_DEMO_ANALYST_EMAIL:-analyst@crimenet.demo}
      - AUTH_LOGIN_MAX_ATTEMPTS=${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      - AUTH_LOGIN_LOCKOUT_SECONDS=${AUTH_LOGIN_LOCKOUT_SECONDS:-300}
      - ALLOW_SELF_REGISTER_INVESTIGATOR=${ALLOW_SELF_REGISTER_INVESTIGATOR:-false}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crimnet-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
    driver: local
